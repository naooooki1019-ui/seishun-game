<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青春を取り戻せ！ v1.5</title>
<style>
*{box-sizing:border-box}
:root{--ink:#18212b;--paper:#f4efe5;--gold:#d7aa68;--navy:#1a2635}
body{
 margin:0;background:#0d1218;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{max-width:1180px;margin:auto;min-height:100vh;background:var(--paper)}
header{
 height:72px;padding:12px 20px;color:#fff;display:flex;align-items:center;justify-content:space-between;
 background:linear-gradient(110deg,#111c29,#263b52 58%,#172330);border-bottom:1px solid #c99958;
}
h1{margin:0;font-size:22px;letter-spacing:.08em;font-weight:800}
.small{font-size:10px;opacity:.62;letter-spacing:.08em;margin-top:3px}
.date{font-size:15px;font-weight:800;letter-spacing:.05em}
main{padding:14px}
.hud{margin-bottom:10px}
.condition-card{
 display:flex;align-items:center;gap:13px;padding:8px 13px;background:#fff;
 border:1px solid #ded5c7;border-radius:10px;box-shadow:0 4px 14px #0000000c;
}
.condition-label{font-size:9px;letter-spacing:.16em;font-weight:900;color:#8a765e}
#condition{font-size:12px;color:#43505b}
.scene{
 position:relative;height:min(72vw,690px);min-height:510px;overflow:hidden;border-radius:17px;
 background:#8aaabd;box-shadow:0 12px 34px #0006;
 isolation:isolate;
}
.bg{position:absolute;inset:0;z-index:0}
.bg svg{width:100%;height:100%;display:block;filter:saturate(.82) contrast(1.08)}
.scene:after{
 content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,#07111a12 25%,#07111a30 52%,#07111a9a 100%);
}
.char{
 position:absolute;z-index:2;right:8%;bottom:132px;width:min(420px,45vw);
 filter:drop-shadow(0 18px 14px #0007) saturate(.88) contrast(1.06);
 transform-origin:center bottom;
 animation:enter .55s ease-out;
}
.char svg{width:100%;height:auto;display:block}
.char.narration{display:none}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.dialog{
 position:absolute;left:2.4%;right:2.4%;bottom:14px;z-index:3;
 padding:0 18px 16px;border-radius:15px;
 background:linear-gradient(180deg,#101b28e9,#0b141eea);
 border:1px solid #ffffff2c;box-shadow:0 10px 34px #0008;
 backdrop-filter:blur(8px);
}
.name-row{display:flex;align-items:end;gap:8px;margin-top:-18px;margin-bottom:8px}
.name{
 min-width:110px;padding:8px 18px;border-radius:9px 9px 3px 3px;
 background:linear-gradient(135deg,#d7aa68,#a87539);color:#fff;font-size:15px;font-weight:900;
 box-shadow:0 5px 14px #0005;
}
.role{
 margin-bottom:4px;padding:4px 8px;border-radius:999px;background:#ffffff16;color:#dce5ec;
 font-size:9px;font-weight:800;letter-spacing:.06em;border:1px solid #ffffff18
}
.text{color:#f6f7f7;font-size:15px;line-height:1.72;min-height:54px;text-shadow:0 1px 2px #000}
.choice-label{color:#d5b176;font-size:9px;font-weight:900;letter-spacing:.18em;margin:6px 0 6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{
 display:flex;align-items:center;gap:10px;text-align:left;padding:10px 11px;border-radius:10px;
 background:#f5f0e7f2;color:#253544;border:1px solid #fff;box-shadow:0 3px 9px #0003;
 transition:transform .12s ease,background .12s ease;
}
.choice:hover{background:#fff;transform:translateY(-1px)}
.result-panel{display:none;color:#f6f7f7}
.result-panel.show{display:block}
.result-label{color:#d5b176;font-size:9px;font-weight:900;letter-spacing:.18em;margin:6px 0}
.result-text{font-size:15px;line-height:1.72;min-height:54px;text-shadow:0 1px 2px #000}
.continue{margin-top:8px;width:100%;padding:11px;border-radius:10px;border:1px solid #c08b4e;background:#a9743f;color:#fff;font-weight:900;font-family:inherit}
.notice{margin:7px 0 0;padding:8px 10px;border-radius:8px;background:#ffffff12;border:1px solid #ffffff18;color:#f4dfb7;font-size:12px;font-weight:800}
.num{
 width:22px;height:22px;display:grid;place-items:center;flex:none;border-radius:50%;
 background:#26394d;color:#fff;font-size:11px;font-weight:900
}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.controls button{
 background:#1f3042;color:#fff;border:1px solid #31465a;border-radius:9px;padding:9px 14px;
 font-weight:800;font-family:inherit
}
.controls .primary{background:#a9743f;border-color:#bd8950;min-width:120px}
.bottom{margin-top:8px}
.log-card{
 background:#fff;border:1px solid #ded6c9;border-radius:10px;padding:8px 11px;color:#56626b
}
.log-card summary{cursor:pointer;font-size:11px;font-weight:900}
.log{font-size:10px;line-height:1.6;max-height:120px;overflow:auto;margin-top:7px}
.overlay{
 position:fixed;inset:0;background:#0a1017d9;display:none;align-items:center;justify-content:center;
 padding:16px;z-index:10
}
.modal{width:min(680px,100%);background:#fffaf2;border-radius:15px;padding:18px;box-shadow:0 20px 60px #0008}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{background:#edf1f3}
@media(max-width:700px){
 header{height:62px;padding:10px 13px} h1{font-size:18px}.date{font-size:13px}
 main{padding:9px}.scene{height:680px;min-height:0;border-radius:13px}
 .char{width:78vw;right:3%;bottom:205px}
 .dialog{left:8px;right:8px;bottom:8px;padding:0 10px 10px;border-radius:12px}
 .name-row{margin-top:-15px}.name{font-size:14px;min-width:94px;padding:7px 13px}
 .text{font-size:13px;line-height:1.62;min-height:48px}
 .choices{grid-template-columns:1fr;gap:6px}.choice{padding:9px 10px}
 .choice-label{margin-top:4px}.condition-card{padding:7px 10px}
 .controls button{padding:8px 11px}
}

/* v1.5 visual/UI refresh */
.hud-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:7px}
.hud-item{display:flex;align-items:center;gap:7px;padding:8px 10px;background:#fff;border:1px solid #ded5c7;border-radius:10px;box-shadow:0 4px 14px #0000000c}
.hud-icon{font-size:19px;line-height:1}.hud-caption{font-size:9px;color:#8a765e;font-weight:900;letter-spacing:.08em}.hud-value{font-size:13px;font-weight:900;color:#263544}
.season-badge{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900}
.page-indicator{float:right;color:#cdb58f;font-size:10px;font-weight:900;letter-spacing:.08em;margin-top:3px}
.text{font-size:17px;line-height:1.82;min-height:105px;white-space:pre-line}
.dialog{padding-bottom:17px}
.page-next{margin-top:8px;width:100%;padding:11px;border-radius:10px;border:1px solid #c08b4e;background:#a9743f;color:#fff;font-weight:900;font-family:inherit;font-size:14px}
.email-card{background:#f7f4ed;color:#263544;border-radius:10px;padding:12px 13px;border-left:4px solid #a9743f;box-shadow:0 4px 12px #0002}
.email-meta{font-size:10px;color:#7a6a58;font-weight:900;margin-bottom:6px}
.email-subject{font-size:15px;font-weight:900;margin-bottom:7px}
.email-body{font-size:15px;line-height:1.75;white-space:pre-line}
.choice.email-choice{background:#fff}
.scene:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#ffffff18 0%,transparent 55%);mix-blend-mode:screen}
.char{filter:drop-shadow(0 20px 16px #0008) saturate(.92) contrast(1.08)}
.bg svg{filter:saturate(.78) contrast(1.12) brightness(.97)}

function currentEvent(){ return events[state.currentId] || events.apr08_morning; }

function applyEffect(effects){
  for(const [k,v] of Object.entries(effects||{})){
    if(k.startsWith("flag:")) continue;
    if(k in state.stats) state.stats[k]=Math.max(0,Math.min(100,state.stats[k]+v));
    else if(k in state) state[k]=Math.max(0,state[k]+v);
  }
}
function applyRelations(relations){
  for(const [id,vals] of Object.entries(relations||{})){
    if(id==="flag") continue;
    if(!state.relations[id]) continue;
    for(const [k,v] of Object.entries(vals)){
      if(k==="affection"||k==="trust") state.relations[id][k]=Math.max(0,Math.min(100,state.relations[id][k]+v));
    }
  }
}
function processExtra(extra){
  if(!extra) return;
  for(const [k,v] of Object.entries(extra)){
    if(k==="flag:metKenta") state.flags.metKenta=!!v;
  }
}


function seasonInfo(month){
  if(month===4) return {icon:"🌸",label:"春"};
  if(month===5||month===6) return {icon:"☔",label:"梅雨"};
  if(month===7||month===8) return {icon:"☀️",label:"夏"};
  if(month===9||month===10||month===11) return {icon:"🍂",label:"秋"};
  return {icon:"⛄",label:"冬"};
}
function timeInfo(phase){
  if(phase==="morning") return {icon:"🌅",label:"朝"};
  if(phase==="afternoon") return {icon:"☀️",label:"昼"};
  if(phase==="night") return {icon:"🌙",label:"夜"};
  return {icon:"🌇",label:"放課後"};
}

function speakerRole(e){
  if(e.who==="saki") return "放送部部長";
  if(e.who==="kenta") return "サッカー部部長";
  if(e.who==="teacher") return "3年A組担任";
  return "ナレーション";
}

function render(){
  const e=currentEvent();
  state.pageIndex=state.pageIndex||0;
  const pages=e.pages||[e.text||""];
  if(state.pageIndex>=pages.length) state.pageIndex=pages.length-1;
  const season=seasonInfo(state.month), tm=timeInfo(state.phase);
  document.getElementById("date").textContent=`${state.month}月${state.day}日`;
  document.getElementById("dateTop").textContent=`${state.month}月${state.day}日`;
  document.getElementById("seasonIcon").textContent=season.icon;
  document.getElementById("staminaValue").textContent=state.stamina;
  document.getElementById("moneyValue").textContent=`¥${state.money.toLocaleString()}`;
  document.getElementById("timeIcon").textContent=tm.icon;
  document.getElementById("timeValue").textContent=tm.label;
  document.getElementById("bg").innerHTML=e.who==="saki"
    ? '<div class="generated-bg" aria-label="春の高校教室イラスト"></div>'
    : bgSvg(e.bg);
  document.getElementById("char").innerHTML=personSvg(e.who==="saki"?"girl":e.who==="kenta"?"boy":e.who);
  document.getElementById("char").className=`char ${e.who==="narration"?"narration":""}`;
  document.getElementById("name").textContent=e.speaker;
  document.querySelector(".role").textContent=e.email?"メール":"クラスメイト";
  document.getElementById("text").textContent=pages[state.pageIndex];
  document.getElementById("pageIndicator").textContent=`${state.pageIndex+1} / ${pages.length}`;
  const last=state.pageIndex===pages.length-1;
  document.getElementById("pageNext").style.display=last?"none":"block";
  document.getElementById("choices").innerHTML=last ? e.choices.map((c,i)=>`<button class="choice ${e.email?'email-choice':''}" onclick="choose(${i})"><span class="num">${i+1}</span><span>${c[0]}</span></button>`).join("") : "";
  document.getElementById("choices").style.display=last?"":"none";
  document.getElementById("resultPanel").classList.remove("show");
  document.getElementById("resultText").textContent="";
  document.getElementById("playerReply").textContent="";
  document.getElementById("purchaseNotice").innerHTML="";
  document.getElementById("transitionPanel").classList.remove("show");
  document.getElementById("log").innerHTML=state.log.slice(-12).reverse().map(x=>`・${x}`).join("<br>")||"まだ記録はありません。";
}
function nextPage(){
  const e=currentEvent(), pages=e.pages||[e.text||""];
  if((state.pageIndex||0)<pages.length-1){state.pageIndex=(state.pageIndex||0)+1;render();}
}
let pendingNext=null;
let transitionNext=null;
function choose(i){
  const e=currentEvent(), c=e.choices[i];
  if(!c) return;
  const cost=Math.max(0,Number(-(c[1]?.money||0)));
  if(cost>state.money){ alert("所持金が足りません。"); return; }
  applyEffect(c[1]); applyRelations(c[2]); if(c[2]) processExtra(c[2]);
  state.log.push(`${state.month}月${state.day}日　${e.email?"メール返信":"会話"}：「${c[0]}」`);
  pendingNext=c[3];
  state.pageIndex=0;
  let result=e.email
    ? "返信を送った。しばらくすると、画面が暗くなり、夜が静かに更けていった。"
    : (e.who==="saki" ? "紗季は少し驚いたあと、ふっと笑った。「うん。それなら、もっと面白くなりそう」"
    : e.who==="kenta" ? "健太は満足そうに笑った。「よし、決まりだな。じゃあ次は――」"
    : e.who==="teacher" ? "佐藤先生は小さくうなずいた。「その調子だ。自分で考えて選べばいい」"
    : "その選択を胸に、主人公は次の時間へ進んだ。");
  if(e.id==="month_end") result="五月の終わり。少しずつ、ただのクラスメイトだった三人の距離が近づいていく。高校生活は、まだ始まったばかりだ。";
  document.getElementById("choices").style.display="none";
  document.getElementById("pageNext").style.display="none";
  document.getElementById("playerReply").textContent=`「${c[0]}」`;
  document.getElementById("resultText").textContent=result;
  if(cost>0){
    const item=c[4]||"商品";
    document.getElementById("purchaseNotice").innerHTML=`<div class="notice">${item}。¥${cost.toLocaleString()}使った。</div>`;
    state.log.push(`${item}。¥${cost.toLocaleString()}使った。`);
  }
  document.getElementById("resultPanel").classList.add("show");
  renderHUDOnly();
}
function renderHUDOnly(){
  document.getElementById("staminaValue").textContent=state.stamina;
  document.getElementById("moneyValue").textContent=`¥${state.money.toLocaleString()}`;
  document.getElementById("log").innerHTML=state.log.slice(-12).reverse().map(x=>`・${x}`).join("<br>")||"まだ記録はありません。";
}
function continueStory(){
  if(!pendingNext) return;
  const next=pendingNext; pendingNext=null; transitionNext=null;
  const e=currentEvent();
  const oldMonth=state.month, oldDay=state.day, oldPhase=state.phase;
  if(next==="nextmonth"){
    state.month++; state.day=1; state.phase="morning";
    state.stamina=Math.min(100,state.stamina+12);
    state.currentId="may01_morning";
  }else{
    const ne=events[next];
    if(ne && ne.month!==state.month){ state.month=ne.month; state.day=1; }
    else if(ne && ne.phase==="morning" && e.phase!=="morning") state.day++;
    if(ne) state.phase=ne.phase;
    state.currentId=next;
    state.stamina=Math.max(0,Math.min(100,state.stamina));
  }
  const changed=oldMonth!==state.month || oldDay!==state.day || oldPhase!==state.phase;
  if(changed){
    transitionNext=state.currentId;
    state.currentId=e.id;
    state.month=oldMonth; state.day=oldDay; state.phase=oldPhase;
    const title = (next==="nextmonth" || (state.month!==events[next]?.month)) ? `翌日${events[next]?.month||state.month+1}月${events[next]?.day||1}日` :
      (oldDay!== (events[next]?.day||oldDay) ? `翌日${events[next]?.month||state.month}月${events[next]?.day||state.day+1}日` : timeInfo(events[next]?.phase||state.phase).label);
    const sub = title.includes("翌日") ? "新しい一日が始まります。" : "時間帯が変わりました。";
    document.getElementById("transitionTitle").textContent=title;
    document.getElementById("transitionSub").textContent=sub;
    document.getElementById("transitionPanel").classList.add("show");
    return;
  }
  state.pageIndex=0; render();
}
function transitionContinue(){
  if(!transitionNext) return;
  const id=transitionNext; transitionNext=null;
  const e=currentEvent(), ne=events[id];
  if(id==="nextmonth"){
    state.month++; state.day=1; state.phase="morning"; state.stamina=Math.min(100,state.stamina+12); state.currentId="may01_morning";
  }else{
    if(ne && ne.month!==state.month){state.month=ne.month;state.day=1;}
    else if(ne && ne.phase==="morning" && e.phase!=="morning") state.day++;
    if(ne) state.phase=ne.phase;
    state.currentId=id;
  }
  state.pageIndex=0; render();
}
function nextDay(){
  if(pendingNext){continueStory();return;}
  alert("物語は「次へ」で進みます。");
}

function showModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("overlay").style.display="flex"}
function closeModal(){document.getElementById("overlay").style.display="none"}
function saveMenu(){
  showModal(`<h2>セーブ</h2><div class="slots">${[1,2,3].map(n=>`<button onclick="saveGame(${n})">スロット ${n}<br><small>${state.month}月${state.day}日 / ${events[state.currentId].speaker}</small></button>`).join("")}</div><p><button onclick="closeModal()">閉じる</button></p>`);
}
function loadMenu(){
  showModal(`<h2>ロード</h2><div class="slots">${[1,2,3].map(n=>`<button onclick="loadGame(${n})">スロット ${n}<br><small>${localStorage.getItem(GAME_KEY+n)?"データあり":"空"}</small></button>`).join("")}</div><p><button onclick="closeModal()">閉じる</button></p>`);
}
function saveGame(n){
  localStorage.setItem(GAME_KEY+n,JSON.stringify(state));
  closeModal();state.log.push(`スロット${n}に保存しました。`);render();
}
function loadGame(n){
  const raw=localStorage.getItem(GAME_KEY+n);
  if(!raw){alert("セーブデータがありません。");return}
  try{
    const loaded=JSON.parse(raw);
    state=loaded;
    pendingNext=null; transitionNext=null;
    state.pageIndex=0;
    if(!state.currentId) state.currentId="apr08_morning";
    closeModal();render();
  }catch(e){alert("セーブデータを読み込めませんでした。")}
}
function ending(){
  showModal(`<h2>卒業式</h2><p>一年間の青春が、静かに幕を閉じた。</p><p>紗季の好感度：${state.relations.saki.affection}</p><p>総合能力：${Object.values(state.stats).reduce((a,b)=>a+b,0)}</p><button onclick="location.reload()">最初から</button>`);
}
render();
</script>
