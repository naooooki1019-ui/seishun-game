<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青春を取り戻せ！</title>
<style>
*{box-sizing:border-box}
:root{--ink:#18212b;--paper:#f4efe5;--gold:#d7aa68;--navy:#1a2635}
body{
 margin:0;background:#0d1218;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{max-width:1180px;margin:auto;min-height:100vh;background:var(--paper)}
header{
 height:72px;padding:12px 20px;color:#fff;display:flex;align-items:center;justify-content:space-between;
 background:linear-gradient(110deg,#111c29,#263b52 58%,#172330);border-bottom:1px solid #c99958;
}
h1{margin:0;font-size:22px;letter-spacing:.08em;font-weight:800}
.small{font-size:10px;opacity:.62;letter-spacing:.08em;margin-top:3px}
.date{font-size:15px;font-weight:800;letter-spacing:.05em}
main{padding:14px}
.hud{margin-bottom:10px}
.condition-card{
 display:flex;align-items:center;gap:13px;padding:8px 13px;background:#fff;
 border:1px solid #ded5c7;border-radius:10px;box-shadow:0 4px 14px #0000000c;
}
.condition-label{font-size:9px;letter-spacing:.16em;font-weight:900;color:#8a765e}
#condition{font-size:12px;color:#43505b}
.scene{
 position:relative;height:min(72vw,690px);min-height:510px;overflow:hidden;border-radius:17px;
 background:#8aaabd;box-shadow:0 12px 34px #0006;
 isolation:isolate;
}
.bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.asset-note{position:absolute;left:10px;bottom:10px;z-index:6;font-size:9px;color:#fff;background:#0008;padding:4px 7px;border-radius:6px;opacity:.75}
.char .asset-character{height:100%;width:auto;max-width:58%;object-fit:contain;object-position:center bottom;display:block;margin:0 auto;filter:drop-shadow(0 8px 12px #0005)}
.bg svg{width:100%;height:100%;display:block;filter:saturate(.82) contrast(1.08)}
.scene:after{
 content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,#07111a12 25%,#07111a30 52%,#07111a9a 100%);
}
.char{
 position:absolute;z-index:2;right:8%;bottom:132px;width:min(420px,45vw);
 filter:drop-shadow(0 18px 14px #0007) saturate(.88) contrast(1.06);
 transform-origin:center bottom;
 animation:enter .55s ease-out;
}
.char svg{width:100%;height:auto;display:block}
.char.narration{display:none}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.dialog{
 position:absolute;left:2.4%;right:2.4%;bottom:14px;z-index:3;
 padding:0 18px 16px;border-radius:15px;
 background:linear-gradient(180deg,#101b28e9,#0b141eea);
 border:1px solid #ffffff2c;box-shadow:0 10px 34px #0008;
 backdrop-filter:blur(8px);
}
.name-row{display:flex;align-items:end;gap:8px;margin-top:-18px;margin-bottom:8px}
.name{
 min-width:110px;padding:8px 18px;border-radius:9px 9px 3px 3px;
 background:linear-gradient(135deg,#d7aa68,#a87539);color:#fff;font-size:15px;font-weight:900;
 box-shadow:0 5px 14px #0005;
}
.role{
 margin-bottom:4px;padding:4px 8px;border-radius:999px;background:#ffffff16;color:#dce5ec;
 font-size:9px;font-weight:800;letter-spacing:.06em;border:1px solid #ffffff18
}
.text{color:#f6f7f7;font-size:15px;line-height:1.72;min-height:54px;text-shadow:0 1px 2px #000}
.choice-label{color:#d5b176;font-size:9px;font-weight:900;letter-spacing:.18em;margin:6px 0 6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{
 display:flex;align-items:center;gap:10px;text-align:left;padding:10px 11px;border-radius:10px;
 background:#f5f0e7f2;color:#253544;border:1px solid #fff;box-shadow:0 3px 9px #0003;
 transition:transform .12s ease,background .12s ease;
}
.choice:hover{background:#fff;transform:translateY(-1px)}
.result-panel{display:none;color:#f6f7f7}
.result-panel.show{display:block}
.result-label{color:#d5b176;font-size:9px;font-weight:900;letter-spacing:.18em;margin:6px 0}
.result-text{font-size:15px;line-height:1.72;min-height:54px;text-shadow:0 1px 2px #000}
.continue{margin-top:8px;width:100%;padding:11px;border-radius:10px;border:1px solid #c08b4e;background:#a9743f;color:#fff;font-weight:900;font-family:inherit}
.notice{margin:7px 0 0;padding:8px 10px;border-radius:8px;background:#ffffff12;border:1px solid #ffffff18;color:#f4dfb7;font-size:12px;font-weight:800}
.num{
 width:22px;height:22px;display:grid;place-items:center;flex:none;border-radius:50%;
 background:#26394d;color:#fff;font-size:11px;font-weight:900
}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.controls button{
 background:#1f3042;color:#fff;border:1px solid #31465a;border-radius:9px;padding:9px 14px;
 font-weight:800;font-family:inherit
}
.controls .primary{background:#a9743f;border-color:#bd8950;min-width:120px}
.bottom{margin-top:8px}
.log-card{
 background:#fff;border:1px solid #ded6c9;border-radius:10px;padding:8px 11px;color:#56626b
}
.log-card summary{cursor:pointer;font-size:11px;font-weight:900}
.log{font-size:10px;line-height:1.6;max-height:120px;overflow:auto;margin-top:7px}
.overlay{
 position:fixed;inset:0;background:#0a1017d9;display:none;align-items:center;justify-content:center;
 padding:16px;z-index:10
}
.modal{width:min(680px,100%);background:#fffaf2;border-radius:15px;padding:18px;box-shadow:0 20px 60px #0008}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{background:#edf1f3}
@media(max-width:700px){
 header{height:62px;padding:10px 13px} h1{font-size:18px}.date{font-size:13px}
 main{padding:9px}.scene{height:680px;min-height:0;border-radius:13px}
 .char{width:78vw;right:3%;bottom:205px}
 .dialog{left:8px;right:8px;bottom:8px;padding:0 10px 10px;border-radius:12px}
 .name-row{margin-top:-15px}.name{font-size:14px;min-width:94px;padding:7px 13px}
 .text{font-size:13px;line-height:1.62;min-height:48px}
 .choices{grid-template-columns:1fr;gap:6px}.choice{padding:9px 10px}
 .choice-label{margin-top:4px}.condition-card{padding:7px 10px}
 .controls button{padding:8px 11px}
}

/* v1.5 visual/UI refresh */
.hud-grid{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr 1.35fr;gap:7px}
.hud-item{display:flex;align-items:center;gap:7px;padding:8px 10px;background:#fff;border:1px solid #ded5c7;border-radius:10px;box-shadow:0 4px 14px #0000000c}
.hud-icon{font-size:19px;line-height:1}.hud-caption{font-size:9px;color:#8a765e;font-weight:900;letter-spacing:.08em}.hud-value{font-size:13px;font-weight:900;color:#263544}
.season-badge{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900}
.page-indicator{float:right;color:#cdb58f;font-size:10px;font-weight:900;letter-spacing:.08em;margin-top:3px}
.text{font-size:17px;line-height:1.82;min-height:105px;white-space:pre-line}
.dialog{padding-bottom:17px}
.page-next{margin-top:8px;width:100%;padding:11px;border-radius:10px;border:1px solid #c08b4e;background:#a9743f;color:#fff;font-weight:900;font-family:inherit;font-size:14px}.page-next:disabled,.continue:disabled{opacity:.45;pointer-events:none}
.email-card{background:#f7f4ed;color:#263544;border-radius:10px;padding:12px 13px;border-left:4px solid #a9743f;box-shadow:0 4px 12px #0002}
.email-meta{font-size:10px;color:#7a6a58;font-weight:900;margin-bottom:6px}
.email-subject{font-size:15px;font-weight:900;margin-bottom:7px}
.email-body{font-size:15px;line-height:1.75;white-space:pre-line}
.choice.email-choice{background:#fff}
.scene:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#ffffff18 0%,transparent 55%);mix-blend-mode:screen}
.char{filter:drop-shadow(0 20px 16px #0008) saturate(.92) contrast(1.08)}
.bg svg{filter:saturate(.78) contrast(1.12) brightness(.97)}
.quirky-char{display:none!important}
.time-in-dialog{margin:0 0 12px;padding:12px 14px;border-left:4px solid #d7aa68;background:#f1eadf;color:#4a3b2b;border-radius:9px;font-weight:900;font-size:16px;text-align:center}

/* v1.8 学園群像劇 / スマホ最適化 */
.scene{
  height:auto; min-height:0; padding-top:300px; overflow:visible;
  border-radius:14px; background:#8799a2;
}
.scene .bg{height:300px;inset:0 0 auto;overflow:hidden;border-radius:14px 14px 0 0}
.scene .char{height:285px;bottom:auto;top:14px;z-index:2;width:min(360px,44vw)}
.scene .char.prod-char{display:block;right:4%;width:min(440px,48vw);height:286px;overflow:hidden;filter:drop-shadow(0 10px 9px #0004) saturate(.78) contrast(1.03)}
.prod-char img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.dialog{
  position:relative;left:auto;right:auto;bottom:auto;margin:0;padding:12px 14px 14px;
  border-radius:0 0 14px 14px;background:#101b28f2;box-shadow:0 8px 22px #0005;
}
.time-in-dialog{
  display:none;padding:7px 10px;margin:-3px 0 9px;border-left:4px solid #d7aa68;
  background:#ffffff10;color:#f0d39e;font-size:13px;font-weight:900;letter-spacing:.04em;
}
.name-row{margin-top:0;margin-bottom:7px}
.text{font-size:18px;line-height:1.65;min-height:0}
.page-indicator{font-size:9px}
.choices{grid-template-columns:1fr;gap:6px;margin-top:9px}
.choice{padding:10px 11px;font-size:15px;background:#f7f4ed}
.result-panel{margin-top:9px}
.result-panel.show{display:block}
.result-label{display:none}
.player-reply{
  margin:6px 0 9px;padding:10px 12px;border-radius:10px;
  background:#cfe4fb;color:#17314a;border-left:4px solid #4f8ed5;font-size:16px;line-height:1.6;
}
.result-text{font-size:16px;line-height:1.65;min-height:0;color:#f6f7f7}
.continue{background:#3f7fc9;border-color:#70a8e7;font-size:15px}
.page-next{background:#3f7fc9;border-color:#70a8e7;display:block;width:100%;min-height:42px;margin-top:10px;position:sticky;bottom:0;z-index:5}
.controls{display:none}
.bottom{margin-top:8px}
.choice-label{display:none}
.generated-bg{display:none!important}
@media(max-width:700px){
  main{padding:7px}
  .hud-grid{grid-template-columns:1fr 1fr;gap:4px}.club-hud{grid-column:1/-1}
  .hud-item{padding:6px 7px;gap:5px}
  .hud-icon{font-size:16px}.hud-caption{font-size:7px}.hud-value{font-size:11px}.club-hud .hud-value{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scene{padding-top:205px}
  .scene .bg{height:205px}
  .scene .char{top:8px;height:198px;width:55vw;right:2%}
  .scene .char.prod-char{height:198px;width:72vw;right:0;filter:drop-shadow(0 7px 7px #0004) saturate(.78) contrast(1.03)}
  .prod-char img{object-fit:cover}
  .dialog{padding:9px 9px 10px}
  .name{font-size:13px;min-width:82px;padding:6px 11px}
  .role{font-size:8px;padding:3px 7px}
  .text{font-size:16px;line-height:1.58}
  .choice{font-size:14px;padding:9px 10px}
  .player-reply{font-size:15px;padding:8px 10px}
  .result-text{font-size:15px}
}

/* v1.9 学園群像劇：人物シルエット */
.silhouette-char{display:flex!important;align-items:flex-end;justify-content:center;right:3%!important;bottom:0!important;top:auto!important;width:230px!important;height:265px!important;filter:none!important;animation:none!important}
.silhouette-person{position:relative;width:150px;height:255px;filter:drop-shadow(0 8px 8px #0004)}
.silhouette-person .head{position:absolute;left:50%;transform:translateX(-50%);top:10px;width:70px;height:82px;border-radius:48% 48% 45% 45%;background:#303943}
.silhouette-person .hair{position:absolute;left:50%;transform:translateX(-50%);top:2px;width:78px;height:48px;border-radius:50% 50% 35% 35%;background:#202832}
.silhouette-person .body{position:absolute;left:50%;transform:translateX(-50%);top:82px;width:104px;height:128px;border-radius:24px 24px 12px 12px;background:#394652}
.silhouette-person .neck{position:absolute;left:50%;transform:translateX(-50%);top:73px;width:28px;height:24px;background:#303943}
.silhouette-person .arm{position:absolute;top:91px;width:29px;height:112px;border-radius:16px;background:#303943}
.silhouette-person .arm.left{left:17px;transform:rotate(8deg)}
.silhouette-person .arm.right{right:17px;transform:rotate(-8deg)}
.silhouette-person .leg{position:absolute;top:197px;width:35px;height:58px;border-radius:8px 8px 4px 4px;background:#28323c}
.silhouette-person .leg.left{left:43px}.silhouette-person .leg.right{right:43px}
.silhouette-person.girl .body{width:112px;height:116px;border-radius:22px 22px 6px 6px}
.silhouette-person.girl .skirt{position:absolute;left:50%;transform:translateX(-50%);top:180px;width:112px;height:45px;background:#303b46;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.silhouette-person.girl .leg{top:216px;height:39px;width:28px}
.silhouette-person.girl .leg.left{left:48px}.silhouette-person.girl .leg.right{right:48px}
.silhouette-person.teacher .head{width:72px;height:78px}
.silhouette-person.teacher .hair{width:82px;height:34px;top:5px;border-radius:50% 50% 20% 20%}
.silhouette-person.teacher .body{width:122px;height:132px;top:82px;border-radius:10px 10px 4px 4px;background:#45515c}
.silhouette-person.teacher .arm{top:90px;height:115px}
.silhouette-person.teacher .leg{top:207px;height:48px}
.silhouette-label{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;white-space:nowrap;padding:5px 12px;border-radius:999px;background:#101b28dd;color:#fff;font-size:13px;font-weight:900;letter-spacing:.04em}
.player-reply{background:#e5edf4;color:#243746;border-left:4px solid #6d879b;border-radius:9px;margin-top:9px}
.result-text{background:#101b28;color:#f6f7f7;border-radius:9px;padding:9px 11px;margin-top:7px}

/* わたおきば公式ページの紹介PNGを人物表示に利用。読み込み失敗時はJSでシルエットへ戻す。
   紹介画像は人物が左側に配置されているため、左側だけを見せる。 */
.wata-char{overflow:hidden!important;display:block!important;right:2%!important;top:6px!important;bottom:auto!important;width:245px!important;height:278px!important;filter:drop-shadow(0 8px 8px #0005)!important}
.wata-crop{position:absolute;left:0;bottom:0;height:100%;width:58%;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start}
.wata-crop .asset-character{position:relative;left:0;top:0;height:100%;width:auto;max-width:none;object-fit:contain;object-position:left bottom;display:block;transform:none}
.wata-char.girl .wata-crop,.wata-char.boy .wata-crop{width:58%}
@media(max-width:700px){.wata-crop{width:62%}.wata-crop .asset-character{height:100%;width:auto}}
.wata-char .asset-note{position:absolute;right:3px;bottom:3px;z-index:3;background:#101b28cc;color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}

/* v3.2: 素材表示をゲーム画面に馴染ませ、紹介画像の人物だけを正しく見せる */
.asset-note{display:none!important}
.wata-char{width:270px!important;height:500px!important;right:3%!important;top:auto!important;bottom:190px!important;overflow:hidden!important;filter:drop-shadow(0 16px 12px #0007)!important}
.wata-crop{position:absolute;left:0;bottom:0;width:235px;height:100%;overflow:hidden;display:block}
.wata-crop .asset-character{position:absolute;left:0;bottom:0;height:100%;width:auto;max-width:none;object-fit:contain;object-position:left bottom;display:block}
.wata-crop.fallback .asset-character{height:100%;width:100%;object-fit:contain}
@media(max-width:700px){.wata-char{width:205px!important;height:420px!important;right:2%!important;bottom:190px!important}.wata-crop{width:180px}.wata-crop .asset-character{height:100%}}

/* 選択肢そのものは残し、見出しや説明ラベルだけを表示しない */
.choice-label,.result-label{display:none!important}
.page-indicator{display:none}
/* 時間・日付の変化は会話欄内だけで表示 */
.time-in-dialog{display:block!important;margin:0 0 8px;padding:7px 10px;background:#25384b;color:#f3d79f;border-left:4px solid #d7aa68;border-radius:7px;text-align:left;font-size:13px}
.time-in-dialog:empty{display:none!important}
/* ゲームロゴ */
.game-brand{text-align:left;padding:2px 0 3px}
.genre-label{display:inline-block;margin:0 0 2px 4px;font-size:10px;font-weight:900;letter-spacing:.28em;color:#c7d3dc;text-shadow:0 1px 3px #0008}
.game-brand h1{margin:0;display:inline-block;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,42px);font-weight:900;letter-spacing:.08em;line-height:1.05;color:#fff;text-shadow:0 2px 0 #17222c,0 4px 12px #0009,-1px -1px 0 #d8e1e8,1px 1px 0 #7890a0}
.game-brand h1::after{content:"";display:block;height:3px;margin-top:6px;width:72%;background:linear-gradient(90deg,#d7aa68,#7d96a6,transparent);border-radius:999px;box-shadow:0 1px 5px #0006}
@media(max-width:700px){
  .silhouette-char{top:8px!important;right:1%!important;width:145px!important;height:190px!important}
  .silhouette-person{transform:scale(.72);transform-origin:bottom center}
  .silhouette-label{font-size:11px;padding:4px 9px}
  .scene{padding-top:205px}
  .player-reply{font-size:15px}
}

/* v2.9: compact pop logo */
.game-brand{min-width:0;max-width:calc(100% - 105px);text-align:left;line-height:1}
.genre-label{display:block;margin:0 0 2px 2px;font-size:8px;font-weight:900;letter-spacing:.14em;color:#e7f4ff;white-space:nowrap}
.game-brand h1{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic UI","Meiryo",sans-serif;font-size:24px;font-weight:900;letter-spacing:-.06em;line-height:1.05;white-space:nowrap;color:#fff;text-shadow:2px 2px 0 #27577d,0 3px 8px #0008,-1px -1px 0 #8fd8ff,1px 1px 0 #5c9fd0}
.version-label{margin-top:2px;font-size:8px;font-weight:800;letter-spacing:.08em;color:#b9c7d2}
@media(max-width:700px){.game-brand{max-width:calc(100% - 72px)}.game-brand h1{font-size:20px;letter-spacing:-.065em}.genre-label{font-size:7px}.version-label{font-size:7px}}

/* v3.2: 「次へ」を常に同じ位置に固定 */
.dialog{
  display:flex!important;
  flex-direction:column!important;
}
.dialog .text{
  flex:0 0 auto;
}
.dialog .page-next{
  flex:0 0 42px;
}
.dialog .choices{
  flex:0 0 auto;
}
.dialog .result-panel{
  flex:0 0 auto;
}
@media(max-width:700px){
  .dialog .page-next{min-height:40px;margin-top:8px}
}


/* v3.2: 佐藤先生専用立ち絵 */
.teacher-char{
  position:absolute;z-index:2;right:3%;bottom:185px;width:270px;height:500px;
  display:block!important;filter:drop-shadow(0 16px 12px #0007)!important;
}
.teacher-char svg{width:100%;height:100%;display:block}
@media(max-width:700px){
  .teacher-char{width:205px;height:420px;right:2%;bottom:190px}
}

</style>
</head>
<body>
<div id="app">
<header><div class="game-brand"><div class="genre-label">学園群像劇</div><h1>青春を取り戻せ！</h1><div class="version-label">v3.2</div></div><div class="date" id="dateTop"></div></header>
<main>
<div class="hud-grid">
 <div class="hud-item"><span class="hud-icon" id="seasonIcon">🌸</span><div><div class="hud-caption">月</div><div class="hud-value" id="date"></div></div></div>
 <div class="hud-item"><span class="hud-icon">❤️</span><div><div class="hud-caption">体力</div><div class="hud-value" id="staminaValue"></div></div></div>
 <div class="hud-item"><span class="hud-icon">💰</span><div><div class="hud-caption">所持金</div><div class="hud-value" id="moneyValue"></div></div></div>
 <div class="hud-item"><span class="hud-icon" id="timeIcon">🌅</span><div><div class="hud-caption">時間帯</div><div class="hud-value" id="timeValue"></div></div></div>
 <div class="hud-item club-hud"><span class="hud-icon">🏫</span><div><div class="hud-caption">所属部活</div><div class="hud-value" id="clubValue">未所属</div></div></div>
</div>
<div class="scene">
 <div class="bg" id="bg"></div><div class="shade"></div><div class="char" id="char"></div>
</div>
 <div class="dialog">

function currentEvent(){ return events[state.currentId] || events.firstterm_ending; }

function applyEffect(effects){
  for(const [k,v] of Object.entries(effects||{})){
    if(k.startsWith("flag:")) continue;
    if(k in state.stats) state.stats[k]=Math.max(0,Math.min(100,state.stats[k]+v));
    else if(k in state) state[k]=Math.max(0,state[k]+v);
  }
}
function applyRelations(relations){
  for(const [id,vals] of Object.entries(relations||{})){
    if(id==="flag") continue;
    if(!state.relations[id]) continue;
    for(const [k,v] of Object.entries(vals)){
      if(k==="affection"||k==="trust") state.relations[id][k]=Math.max(0,Math.min(100,state.relations[id][k]+v));
    }
  }
}
function processExtra(extra){
  if(!extra) return;
  for(const [k,v] of Object.entries(extra)){
    if(k==="flag:metKenta") state.flags.metKenta=!!v;
    if(k==="flag:metLio") state.flags.metLio=!!v;
    if(k==="club") state.club=v;
  }
}


const SCHOOL_YEAR=2026;
function weekdayInfo(month,day){
  const d=new Date(SCHOOL_YEAR,month-1,day);
  const labels=["日","月","火","水","木","金","土"];
  const w=labels[d.getDay()];
  let note="";
  if(w==="月") note="小テスト";
  else if(w==="水") note="部活なし・早帰り";
  else if(w==="金") note="週末前";
  return {label:w,note};
}
function dateLabel(month,day){
  const w=weekdayInfo(month,day);
  return `${month}月${day}日（${w.label}）`;
}
function dayRuleText(month,day){
  const w=weekdayInfo(month,day);
  return w.note;
}

function seasonInfo(month){
  if(month===4) return {icon:"🌸",label:"春"};
  if(month===5||month===6) return {icon:"☔",label:"梅雨"};
  if(month===7||month===8) return {icon:"☀️",label:"夏"};
  if(month===9||month===10||month===11) return {icon:"🍂",label:"秋"};
  return {icon:"⛄",label:"冬"};
}
function timeInfo(phase){
  if(phase==="morning") return {icon:"🌅",label:"朝"};
  if(phase==="afternoon") return {icon:"☀️",label:"昼"};
  if(phase==="night") return {icon:"🌙",label:"夜"};
  return {icon:"🌇",label:"放課後"};
}

function speakerRole(e){
  if(e.who==="saki") return "放送部部長";
  if(e.who==="kenta") return "サッカー部部長";
  if(e.who==="teacher") return "3年A組担任";
  if(e.who==="lio") return "美術部";

function clearConversationUI(){
  document.getElementById("choices").innerHTML="";
  document.getElementById("choices").style.display="none";
  document.getElementById("resultPanel").classList.remove("show");
  document.getElementById("playerReply").textContent="";
  document.getElementById("resultText").textContent="";
  document.getElementById("purchaseNotice").innerHTML="";
  document.getElementById("timeInDialog").textContent="";
}

function render(){
  clearConversationUI();
  const e=currentEvent();
  state.pageIndex=state.pageIndex||0;
  const pages=e.pages||[e.text||""];
  if(state.pageIndex>=pages.length) state.pageIndex=pages.length-1;
  const season=seasonInfo(state.month), tm=timeInfo(state.phase);
  state.club=state.club||"未所属";
  const wd=weekdayInfo(state.month,state.day);
  document.getElementById("date").textContent=`${state.month}月${state.day}日（${wd.label}）`;
  document.getElementById("dateTop").textContent=`${dateLabel(state.month,state.day)}${wd.note?"　"+wd.note:""}`;
  document.getElementById("clubValue").textContent=state.club;
  document.getElementById("seasonIcon").textContent=season.icon;
  document.getElementById("staminaValue").textContent=state.stamina;
  document.getElementById("moneyValue").textContent=`¥${state.money.toLocaleString()}`;
  document.getElementById("timeIcon").textContent=tm.icon;
  document.getElementById("timeValue").textContent=tm.label;
  const bgEl=document.getElementById("bg");
bgEl.innerHTML=`<img src="${ASSETS.backgrounds[e.bg]||ASSETS.backgrounds.classroom}" alt="学校の背景" onerror="this.style.display='none';this.nextElementSibling.style.display='block';"><div class="bg-fallback" style="display:none;width:100%;height:100%;">${bgSvg(e.bg)}</div>`;
  const typeMap={saki:"girl",lio:"girl",kenta:"boy",teacher:"teacher"};
  const type=typeMap[e.who]||"boy";
  const charSrc=ASSETS.characters[e.who]||ASSETS.fallbackCharacter;
  
  document.getElementById("char").innerHTML=`<div class="wata-crop"><img class="asset-character" src="${charSrc}" alt="${e.speaker}" onerror="this.onerror=null;this.src=ASSETS.fallbackCharacter;this.closest('.wata-crop').classList.add('fallback');"></div>`;
  document.getElementById("char").className=`char silhouette-char wata-char ${type}`;
  document.getElementById("name").textContent=e.speaker;
  document.querySelector(".role").textContent=e.email?"メール":speakerRole(e);
  document.getElementById("text").textContent=pages[state.pageIndex];
  document.getElementById("pageIndicator").textContent=`${state.pageIndex+1} / ${pages.length}`;
  const last=state.pageIndex===pages.length-1;
  const pageBtn=document.getElementById("pageNext");
  pageBtn.disabled=false;
  if(e.isNightReply && last){
    pageBtn.style.display="block";
    pageBtn.textContent="次へ";
    pageBtn.onclick=nextPage;
    pendingNext=e.autoNext;
  }else{
    pageBtn.style.display=last?"none":"block";
    pageBtn.textContent="次へ";
    pageBtn.onclick=nextPage;
  }
  document.getElementById("choices").innerHTML=last ? (e.choices||[]).map((c,i)=>`<button class="choice ${e.email?'email-choice':''}" onclick="choose(${i})"><span class="num">${i+1}</span><span>${c[0]}</span></button>`).join("") : "";
  document.getElementById("choices").style.display=last && (e.choices||[]).length?"":"none";
  document.getElementById("resultPanel").classList.remove("show");
  document.getElementById("resultText").textContent="";
  document.getElementById("playerReply").textContent="";
  document.getElementById("purchaseNotice").innerHTML="";
  document.getElementById("timeInDialog").textContent="";
  document.getElementById("log").innerHTML=state.log.slice(-12).reverse().map(x=>`・${x}`).join("<br>")||"まだ記録はありません。";
}
function nextPage(){
  const e=currentEvent(), pages=e.pages||[e.text||""];
  const btn=document.getElementById("pageNext");
  if(btn){btn.disabled=true;btn.style.display="none";}
  if((state.pageIndex||0)<pages.length-1){
    state.pageIndex=(state.pageIndex||0)+1;
    render();
    return;
  }
  if(e.isNightReply && e.autoNext){
    pendingNext=e.autoNext;
    continueStory();
  }
}
let pendingNext=null;
let transitionNext=null;
function choose(i){
  const e=currentEvent(), c=e.choices[i];
  if(!c) return;
  const cost=Math.max(0,Number(-(c[1]?.money||0)));
  if(cost>state.money){ alert("所持金が足りません。"); return; }
  applyEffect(c[1]); applyRelations(c[2]); if(c[2]) processExtra(c[2]);
  state.log.push(`${state.month}月${state.day}日　${e.email?"メール返信":"会話"}：「${c[0]}」`);
  pendingNext=c[3];
  state.pageIndex=0;
  let result=e.email
    ? "返信を送った。しばらくすると、画面が暗くなり、夜が静かに更けていった。"
    : (e.id==="apr08_morning" ? [
        "佐藤先生は安心したようにうなずいた。「それでいい。最初から無理に馴染もうとしなくていい。まずは一日の流れを覚えていこう」",
        "佐藤先生はうなずいた。「その気持ちは大切だ。ただ、相手の様子を見ながら声をかけることも忘れないようにな」",
        "佐藤先生は少し声を和らげた。「緊張するのは当然だ。転校初日ならなおさらだな。困ったことがあれば、いつでも私に聞きなさい」"
      ][i] : e.who==="saki" ? "紗季は少し驚いたあと、ふっと笑った。「うん。それなら、もっと面白くなりそう」"
    : e.who==="kenta" ? "健太は満足そうに笑った。「よし、決まりだな。じゃあ次は――」"
    : e.who==="teacher" ? "佐藤先生は小さくうなずいた。「その調子だ。自分で考えて選べばいい」"
    : "その選択を胸に、僕は次の時間へ進んだ。");
  if(e.id==="firstterm_ending") result="一学期が終わった。夏休みを前に、僕の高校生活はここからさらに続いていく。";
  document.getElementById("choices").style.display="none";
  document.getElementById("pageNext").style.display="none";
  document.getElementById("playerReply").textContent=`「${c[0]}」`;
  document.getElementById("resultText").textContent=result;
  if(cost>0){
    const item=c[4]||"商品";
    document.getElementById("purchaseNotice").innerHTML=`<div class="notice">${item}。¥${cost.toLocaleString()}使った。</div>`;
    state.log.push(`${item}。¥${cost.toLocaleString()}使った。`);
  }
  document.getElementById("resultPanel").classList.add("show");
  const cb=document.querySelector(".continue");
  if(cb){ cb.disabled=false; cb.style.display="block"; cb.onclick=continueStory; }
  renderHUDOnly();
}
function renderHUDOnly(){
  document.getElementById("staminaValue").textContent=state.stamina;
  document.getElementById("moneyValue").textContent=`¥${state.money.toLocaleString()}`;
  document.getElementById("log").innerHTML=state.log.slice(-12).reverse().map(x=>`・${x}`).join("<br>")||"まだ記録はありません。";
}
function continueStory(){
  clearConversationUI();
  const cb=document.querySelector(".continue");
  if(cb){cb.disabled=true;cb.style.display="none";}
  if(!pendingNext) return;
  const next=pendingNext; pendingNext=null; transitionNext=null;
  const e=currentEvent();
  const oldMonth=state.month, oldDay=state.day, oldPhase=state.phase;
  if(next==="restart"){ location.reload(); return; }
  if(next==="nextmonth"){
    state.currentId="firstterm_ending"; state.pageIndex=0;
  }else{
    const ne=events[next];
    if(ne && ne.month!==state.month){ state.month=ne.month; state.day=1; }
    else if(ne && ne.phase==="morning" && e.phase!=="morning") state.day++;
    if(ne) state.phase=ne.phase;
    state.currentId=next;
    state.stamina=Math.max(0,Math.min(100,state.stamina));
  }
  const changed=oldMonth!==state.month || oldDay!==state.day || oldPhase!==state.phase;
  if(changed){
    transitionNext=state.currentId;
    state.currentId=e.id;
    state.month=oldMonth; state.day=oldDay; state.phase=oldPhase;
    const title = (next==="nextmonth" || (state.month!==events[next]?.month)) ? `${events[next]?.month||state.month+1}月${events[next]?.day||1}日…` :
      (oldDay!== (events[next]?.day||oldDay) ? `${events[next]?.month||state.month}月${events[next]?.day||state.day+1}日…` : `${timeInfo(events[next]?.phase||state.phase).label}…`);
    const sub = title.includes("翌日") ? "翌日。" : timeInfo(events[next]?.phase||state.phase).label;
    const notice=document.getElementById("timeInDialog");
    notice.textContent=title;
    notice.style.display="block";
    document.getElementById("name").textContent="";
    document.querySelector(".role").textContent="";
    document.getElementById("pageIndicator").textContent="";
    document.getElementById("text").textContent=sub;
    document.getElementById("pageNext").style.display="block";
    document.getElementById("pageNext").textContent="次へ";
    document.getElementById("pageNext").onclick=transitionContinue;
      return;
  }
  state.pageIndex=0; render();
}
function transitionContinue(){
  if(!transitionNext) return;
  const id=transitionNext; transitionNext=null;
  const e=currentEvent(), ne=events[id];
  if(id==="nextmonth"){
    state.month++; state.day=1; state.phase="morning"; state.stamina=Math.min(100,state.stamina+12); state.currentId="may01_morning";
  }else{
    if(ne && ne.month!==state.month){state.month=ne.month;state.day=1;}
    else if(ne && ne.phase==="morning" && e.phase!=="morning") state.day++;
    if(ne) state.phase=ne.phase;
    state.currentId=id;
  }
  state.pageIndex=0; render();
}
function nextDay(){
  if(pendingNext){continueStory();return;}
  alert("物語は「次へ」で進みます。");
}

function showModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("overlay").style.display="flex"}
function closeModal(){document.getElementById("overlay").style.display="none"}
function saveMenu(){
  showModal(`<h2>セーブ</h2><div class="slots">${[1,2,3].map(n=>`<button onclick="saveGame(${n})">スロット ${n}<br><small>${dateLabel(state.month,state.day)} / ${events[state.currentId].speaker}</small></button>`).join("")}</div><p><button onclick="closeModal()">閉じる</button></p>`);
}
function loadMenu(){
  showModal(`<h2>ロード</h2><div class="slots">${[1,2,3].map(n=>`<button onclick="loadGame(${n})">スロット ${n}<br><small>${localStorage.getItem(GAME_KEY+n)?"データあり":"空"}</small></button>`).join("")}</div><p><button onclick="closeModal()">閉じる</button></p>`);
}
function saveGame(n){
  localStorage.setItem(GAME_KEY+n,JSON.stringify(state));
  closeModal();state.log.push(`スロット${n}に保存しました。`);render();
}
function loadGame(n){
  const raw=localStorage.getItem(GAME_KEY+n);
  if(!raw){alert("セーブデータがありません。");return}
  try{
    const loaded=JSON.parse(raw);
    state=loaded;
    pendingNext=null; transitionNext=null;
    state.pageIndex=0;
    if(!state.currentId) state.currentId="apr08_morning";
    state.club=state.club||"未所属";
    closeModal();render();
  }catch(e){alert("セーブデータを読み込めませんでした。")}
}
function ending(){
  showModal(`<h2>卒業式</h2><p>一年間の青春が、静かに幕を閉じた。</p><p>紗季の好感度：${state.relations.saki.affection}</p><p>総合能力：${Object.values(state.stats).reduce((a,b)=>a+b,0)}</p><button onclick="location.reload()">最初から</button>`);
}

// v2.9: 初回表示時から「次へ」を確実に有効化する
(function bindNextButton(){
  const btn=document.getElementById("pageNext");
  if(!btn) return;
  btn.type="button";
  btn.disabled=false;
  btn.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); nextPage(); };
})();
render();
</script>
